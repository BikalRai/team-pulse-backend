spring:
  main:
    banner-mode: off
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/team_pulse}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    out-of-order: true

server:
  shutdown: graceful

logging:
  level:
    root: DEBUG


